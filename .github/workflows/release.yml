# 发版：push main 自增 patch；人工打 tag 按该 tag 发；workflow_dispatch 补发。
#
# 这个仓库是 **FastAPI 服务**（部署走源码 tar + docker compose build），
# 没有 Python 包产物、也不推 GHCR —— 所以这里只做版本标记与 Release notes，
# 不构建镜像。镜像 tag 只写回 compose 文件（部署时 `up -d --build` 用它命名）。
name: release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要补发的 tag（必须已存在，如 v0.1.1）'
        required: true

# 建 tag / Release 需要写权限；缺这条会在创建 tag 时 403（最高频失败原因）
permissions:
  contents: write

# 同一 ref 串行：两人先后 push 时不能让两个进程读到同一个 tag 再各自自增
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # 逃生阀：commit message 含 skip-release 标记则整条跳过；
    # bot 自己推的提交（bump）不再触发（GITHUB_TOKEN 推送本就不触发，这是兜底）
    if: >-
      ${{ github.actor != 'github-actions[bot]'
          && !contains(github.event.head_commit.message || '', '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 三种入口取不同的 ref（这条踩过：补发检出默认分支会用主干代码发旧 tag）
          ref: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref || github.sha) }}
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            mode=tag; tag="$INPUT_TAG"
          elif [ "${REF#refs/tags/}" != "$REF" ]; then
            mode=tag; tag="${REF#refs/tags/}"
          else
            mode=auto
          fi

          if [ "$mode" = auto ]; then
            latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
            latest="${latest:-v0.0.0}"          # 冷启动：零 tag 时从 0.0.0 起算
            core="${latest#v}"
            major="${core%%.*}"; rest="${core#*.}"
            minor="${rest%%.*}"; patch="${rest#*.}"
            patch="${patch%%[-+]*}"             # 剥预发布后缀，否则算术报错
            tag="v${major}.${minor}.$((patch + 1))"
            end=HEAD
          else
            end="$tag"
          fi

          # changelog 右端点：auto 是 HEAD（tag 还没打），tag 模式是该 tag
          if prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${end}^" 2>/dev/null)"; then
            range="${prev}..${end}"
          else
            range="$end"
          fi

          {
            echo 'notes<<CHANGELOG_EOF'
            git log "$range" --no-merges --pretty='- %s (%h)' --max-count=80
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

          # 🔴 下面 echo 的键名必须与后面 steps.ver.outputs.* 的引用名逐字一致。
          # GitHub 表达式取不到名字**不报错**，静默求值为空串（曾因此打出空 tag）。
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "resolved: mode=$mode tag=$tag range=$range"

      - name: Bump version files (auto only)
        if: steps.ver.outputs.mode == 'auto'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if python3 scripts/bump_version.py --check | grep -q "版本一致：$VERSION"; then
            echo "版本已是 $VERSION，跳过写回（bump 幂等）"
            exit 0
          fi

          python3 scripts/bump_version.py "$VERSION"
          git add app/__init__.py docker-compose.yml deploy/ai-prod/docker-compose.yml
          git commit -m "chore(release): ${TAG}"
          # detached HEAD 上没有叫 main 的本地分支，必须 HEAD:main
          git push origin HEAD:main

      # 只有 auto 模式才新建 tag：tag 模式（人工 tag / 派发补发）那个 tag 本来就存在，
      # 再打一次会 get "already exists" 变红。
      - name: Create tag
        if: steps.ver.outputs.mode == 'auto'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG 已存在（并发或人工已打过），拒绝覆盖"
            exit 1
          fi
          # annotated tag 需要 committer 身份，runner 上没有全局配置 → 上面那两行
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create release
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          NOTES: ${{ steps.ver.outputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 幂等：同一个 tag 重跑不该变红
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，跳过"
            exit 0
          fi
          printf '%s\n' "${NOTES:-（无提交记录）}" > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md

      - name: Summary
        run: |
          {
            echo "### release ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "mode: \`${{ steps.ver.outputs.mode }}\`"
            echo "range: \`${{ steps.ver.outputs.range }}\`"
            echo ""
            echo "${{ steps.ver.outputs.notes }}"
          } >> "$GITHUB_STEP_SUMMARY"
