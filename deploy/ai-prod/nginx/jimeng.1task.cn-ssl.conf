# jimeng.1task.cn HTTPS 入口
# 证书：acme.sh（Let's Encrypt），HTTP-01（DNS 已指向本机），自动续期并 reload nginx。
#
# ⚠️ 本文件被 nginx 在 http 块内 include ⇒ `limit_req_zone` 可写在 server 之外。
limit_req_zone $binary_remote_addr zone=jimeng_api:10m rate=1200r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jimeng.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/jimeng.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/jimeng.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/jimeng.1task.cn.log;
    error_log  /www/wwwlogs/jimeng.1task.cn.error.log;

    # 鉴权在服务内部（/v1/* 用 api_key，/panel/api/* 用 admin_key），入口层不加 auth_basic。
    auth_basic off;

    # 远程浏览器 WebSocket：服务内部走一次性 ticket，不套 SSO；
    # 单独精确匹配以便透传 Upgrade（这是本项目唯一的 WS 端点）。
    location = /panel/ws/remote {
        proxy_pass http://127.0.0.1:39076;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 面板 API 放行：它自己校验 admin_key，脚本/CI 直连没有浏览器 cookie，
    # 被 SSO 拦会直接把自动化打断。
    location ^~ /panel/api/ {
        limit_req zone=jimeng_api burst=200 nodelay;
        limit_req_status 429;
        include /www/server/panel/vhost/nginx/jimeng-proxy.inc;
    }

    # 面板页面走统一登录：无会话 302 到 sso.1task.cn，登录后回跳原地址。
    location ^~ /panel/ {
        auth_request /_sso_verify;
        auth_request_set $sso_sub $upstream_http_x_sso_sub;
        error_page 401 = @sso_login;
        include /www/server/panel/vhost/nginx/jimeng-proxy.inc;
        proxy_set_header X-SSO-Sub $sso_sub;
    }

    # 运维面（OpenAPI 文档、指标）在入口层挡掉，只留服务端自用。
    location ^~ /docs         { return 404; }
    location ^~ /openapi.json { return 404; }
    location ^~ /stats        { return 404; }

    include /www/server/panel/vhost/nginx/sso-auth.inc;

    location / {
        # 洪水闸门（**不是鉴权**）：20r/s 持续、200 突发。
        limit_req zone=jimeng_api burst=200 nodelay;
        limit_req_status 429;
        include /www/server/panel/vhost/nginx/jimeng-proxy.inc;
    }
}
