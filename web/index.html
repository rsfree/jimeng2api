<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jimeng2api 控制台</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/panel/assets/styles.css">
</head>
<body>

<div class="shell" id="app" hidden>
  <aside class="nav">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--accent-solid)"/>
        <path d="M9 22V10h5l2.5 6 2.5-6h4v12h-3v-7l-2.2 5h-2.6L13 15v7z" fill="#fff"/>
        <circle cx="24.5" cy="10.5" r="2.2" fill="#7de2b8"/>
      </svg>
      <div>
        <div class="name">jimeng2api</div>
        <div class="sub">国内即梦网关</div>
      </div>
    </div>
    <ul>
      <li class="nav-h">运营</li>
      <li class="nav-i"><a href="#overview" data-view="overview">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.2" y="2.2" width="5" height="5" rx="1.2"/><rect x="8.8" y="2.2" width="5" height="5" rx="1.2"/><rect x="2.2" y="8.8" width="5" height="5" rx="1.2"/><rect x="8.8" y="8.8" width="5" height="5" rx="1.2"/></svg>
        概览</a></li>
      <li class="nav-i"><a href="#accounts" data-view="accounts">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.3c.7-2.6 2.7-3.9 5-3.9s4.3 1.3 5 3.9"/></svg>
        账号池<span class="count" id="navAccCount"></span></a></li>
      <li class="nav-i"><a href="#tasks" data-view="tasks">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.4" y="2.9" width="11.2" height="8.1" rx="1.7"/><path d="M5.7 11v2.3L8.2 11"/><path d="M5.4 6h5.2M5.4 8.3h3"/></svg>
        任务中心<span class="count" id="navTaskCount"></span></a></li>
      <li class="nav-h">观测</li>
      <li class="nav-i"><a href="#usage" data-view="usage">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 13.4h10.8"/><path d="M4.9 13.4V8.7M8 13.4V4.4M11.1 13.4v-3.2"/></svg>
        用量</a></li>
      <li class="nav-i"><a href="#logs" data-view="logs">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3.4h10M3 6.5h10M3 9.6h6.4M3 12.7h4.2"/></svg>
        日志</a></li>
      <li class="nav-h">配置</li>
      <li class="nav-i"><a href="#models" data-view="models">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.9l5.2 2.9v6.3L8 14.1 2.8 11.1V4.8z"/><path d="M2.8 4.8L8 7.7l5.2-2.9M8 7.7v6.4"/></svg>
        模型与档位</a></li>
      <li class="nav-i"><a href="#keys" data-view="keys">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.6" cy="10.4" r="2.7"/><path d="M7.6 8.4l5-5M10.6 5.4l1.6 1.6M12.1 3.9l1.6 1.6"/></svg>
        访问密钥</a></li>
      <li class="nav-i"><a href="#settings" data-view="settings">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 5.4h10.8M2.6 10.6h10.8"/><circle cx="6" cy="5.4" r="1.7"/><circle cx="10" cy="10.6" r="1.7"/></svg>
        设置</a></li>
    </ul>
    <div class="nav-foot">
      <span class="ver" id="navVersion">v0.1.0</span>
      <button class="icon-btn" id="btnTheme" title="切换明暗">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3.1"/><path d="M8 1.6v1.6M8 12.8v1.6M1.6 8h1.6M12.8 8h1.6M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1"/></svg>
      </button>
      <button class="icon-btn" id="btnLogout" title="退出">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.4 2.6H3.4v10.8h3M9.6 5.2L12.4 8l-2.8 2.8M12.4 8H6.8"/></svg>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">概览</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <span class="grow"></span>
      <div class="row" id="topActions"></div>
      <button class="icon-btn" id="btnRefresh" title="刷新当前页">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.7"/><path d="M13.4 2.6v2.9h-2.9"/></svg>
      </button>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div id="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#4a6ae8"/>
      <path d="M9 22V10h5l2.5 6 2.5-6h4v12h-3v-7l-2.2 5h-2.6L13 15v7z" fill="#fff"/>
      <circle cx="24.5" cy="10.5" r="2.2" fill="#7de2b8"/>
    </svg>
    <h2>需要访问密钥</h2>
    <p>该网关已启用 Key 鉴权。首次启动的密钥写在 <code>data/first_boot_key.txt</code>，
       或使用你在「访问密钥」里创建的管理员 Key。</p>
    <input class="input" id="gateKey" type="password" placeholder="sk-…" autocomplete="off" style="width:100%">
    <div class="err" id="gateErr"></div>
    <button class="btn primary" type="submit" style="width:100%;height:36px;margin-top:4px">进入控制台</button>
    <div class="path">GET /v1/models 与 /healthz 免鉴权；其余接口需 <code>Authorization: Bearer &lt;key&gt;</code></div>
  </form>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header><h3 id="drawerTitle">详情</h3><span class="grow"></span>
    <button class="icon-btn" id="drawerClose" title="关闭">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
  </header>
  <div class="body" id="drawerBody"></div>
  <div class="foot" id="drawerFoot"></div>
</aside>

<dialog class="dlg" id="dlg">
  <form method="dialog" id="dlgForm">
    <header><h3 id="dlgTitle">标题</h3><span class="grow"></span>
      <button class="icon-btn" value="cancel" type="submit" aria-label="关闭">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </header>
    <div class="body" id="dlgBody"></div>
    <footer id="dlgFoot"></footer>
  </form>
</dialog>

<div id="lightbox">
  <button class="icon-btn close" id="lightboxClose" aria-label="关闭">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
  </button>
  <img id="lightboxImg" alt="">
</div>

<div id="toasts"></div>
<script src="/panel/assets/app.js"></script>
</body>
</html>
